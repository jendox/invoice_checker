{% set field_prefix = upload_field_prefix|default('') %}
<div class="form-group">
  <label for="{{ field_prefix }}file">Statement File</label>
  <input type="file" id="{{ field_prefix }}file" name="file" accept=".csv,.xlsx,.xls" required>
</div>
<div class="form-group">
  <label for="{{ field_prefix }}company_name">Company</label>
  <select id="{{ field_prefix }}company_name" name="company_name">
    <option value="">— Select —</option>
    {% for company in upload_companies %}
    <option value="{{ company.key }}" {% if upload_company_name == company.key %}selected{% endif %}>{{ company.display_name }}</option>
    {% endfor %}
  </select>
</div>
<div class="form-group">
  <label for="{{ field_prefix }}bank_name">Bank (auto-detected from filename if empty)</label>
  <select id="{{ field_prefix }}bank_name" name="bank_name">
    <option value="">Auto-detect</option>
    {% for bank in upload_banks %}
    {% if bank.key != 'generic' %}
    <option value="{{ bank.key }}" {% if upload_bank_name == bank.key %}selected{% endif %}>{{ bank.display_name }}</option>
    {% endif %}
    {% endfor %}
  </select>
</div>
<div class="form-group">
  <label for="{{ field_prefix }}statement_month">Statement Month (YYYY-MM)</label>
  <input
    type="text"
    id="{{ field_prefix }}statement_month"
    name="statement_month"
    value="{{ upload_statement_month or default_statement_month }}"
    pattern="\d{4}-\d{2}"
    required
  >
</div>
<div class="form-group">
  <label for="{{ field_prefix }}statement_currency">Statement Currency</label>
  <select id="{{ field_prefix }}statement_currency" name="statement_currency">
    {% for currency_code in statement_currencies %}
    <option
      value="{{ currency_code }}"
      {% if (upload_statement_currency or default_statement_currency) == currency_code %}selected{% endif %}
    >{{ currency_code }}</option>
    {% endfor %}
  </select>
</div>

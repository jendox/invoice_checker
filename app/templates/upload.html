{% extends "base.html" %}
{% block title %}Upload — Invoice Checker{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Upload Statement</h1>
  <p>Import CSV or XLSX bank statements. Invoice & Comment columns are ignored.</p>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="card" style="max-width: 560px;">
  <form action="/upload" method="post" enctype="multipart/form-data">
    {% include "_upload_form_fields.html" %}
    <button type="submit" class="btn btn-primary">Upload & Classify</button>
  </form>
</div>
{% endblock %}

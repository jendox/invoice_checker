<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Invoice Checker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">📋 <span>Invoice</span> Checker</div>
      <nav>
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/transactions" class="nav-link {% if request.url.path.startswith('/transactions') %}active{% endif %}">Transactions</a>
        <a href="/rules" class="nav-link {% if request.url.path == '/rules' %}active{% endif %}">Rules</a>
        <a href="/categories" class="nav-link {% if request.url.path == '/categories' %}active{% endif %}">Categories</a>
        <a href="/vendors" class="nav-link {% if request.url.path == '/vendors' %}active{% endif %}">Vendors</a>
        <a href="/invoice-owners" class="nav-link {% if request.url.path == '/invoice-owners' %}active{% endif %}">Invoice Owners</a>
        <a href="/banks" class="nav-link {% if request.url.path == '/banks' %}active{% endif %}">Banks</a>
        <a href="/exports/invoice-requests.xlsx" class="nav-link">Export XLSX</a>
        <a href="/docs" class="nav-link" target="_blank">API Docs</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/ui.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice_checker
      POSTGRES_PASSWORD: invoice_checker
      POSTGRES_DB: invoice_checker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_checker -d invoice_checker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
